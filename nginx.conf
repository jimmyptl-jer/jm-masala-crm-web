# nginx configuration for the production web container (web/Dockerfile): serves the built single-page app
# from /usr/share/nginx/html on port 80.
# Only static files are served; the app talks to the Express API directly at the URL baked in as
# VITE_API_URL at build time, so nginx does not proxy /api.
# Adds basic security headers, long caching for hashed assets and a SPA fallback to index.html.

# Single-page app: every unknown path serves index.html so deep links like /quotes/123 work
# (the marketing site's nginx has no such fallback, which is why this app is deployed separately).
# Server block copied into the nginx image as /etc/nginx/conf.d/default.conf (see Dockerfile). It serves the
# built static site from dist/.
server {
  # Plain HTTP inside the container; HTTPS is expected to be handled by the hosting platform / reverse proxy
  # in front.
  listen 80;
  # Catch-all name: answer for any host name.
  server_name _;
  # Where the Dockerfile copies the built files (dist/).
  root /usr/share/nginx/html;
  index index.html;

  # Security headers: browsers must not guess file types (nosniff); the app may not be shown inside a frame
  # (clickjacking protection); only the site's own origin is sent as referrer on cross-site requests.
  # `always` adds them to error responses too.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Vite writes hashed file names (e.g. index-3f9a1c.js) into /assets/, so these files never change once
  # published: cache for a year (immutable). A missing asset returns 404 instead of falling back to
  # index.html.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # index.html is NOT cached (no-cache = always revalidate), otherwise users could keep an old page that
  # points to old, deleted asset file names after a new deployment.
  location = /index.html { add_header Cache-Control "no-cache"; }
  # Single-page-app fallback: serve the file if it exists (e.g. /logo.png), otherwise index.html, and let
  # the React router handle the URL.
  location / { try_files $uri /index.html; }
}
